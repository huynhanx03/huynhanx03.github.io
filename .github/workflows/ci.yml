name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: make install
      - run: make check
      - run: make verify-build
        env:
          PUBLIC_SITE_URL: https://huynhanx03.github.io
          PUBLIC_BASE_PATH: ""
